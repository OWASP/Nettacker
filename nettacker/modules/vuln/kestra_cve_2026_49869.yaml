info:
  name: kestra_cve_2026_49869_vuln
  author: OWASP Nettacker Team
  severity: 10.0
  description: >
    CVE-2026-49869 is a critical authentication bypass (CVSS 10.0) in Kestra OSS that leads to
    unauthenticated remote code execution. The API authentication filter skips any path ending in
    "/configs", so an unauthenticated attacker can create and run workflows.
    Fixed releases include 1.0.45 and 1.3.21. Detection is behavioral, not version-based.
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2026-49869
    - https://github.com/kestra-io/kestra/security/advisories/GHSA-5vc5-wxxq-3fjx
  profiles:
    - vuln
    - http
    - critical_severity
    - cve
    - cve2026
    - cisa_kev
    - kestra

# Each protocol/port has isolated dependency events. Carry the preceding status
# in a query parameter so a missing dependency cannot produce a finding.
# The final public-config fingerprint rejects generic gateway 401/404 responses.
# Older releases (verified on 0.24.0) do not include the edition field.
payloads:
  - library: http
    steps:
      - method: get
        timeout: 3
        headers:
          User-Agent: "{user_agent}"
        allow_redirects: false
        ssl: false
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/api/v1/main/flows/nettacker/auth_check"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
              ports:
                - 8080
        response:
          save_to_temp_events_only: kestra_auth_required_1
          condition_type: and
          conditions:
            status_code:
              regex: "401"
              reverse: false

      - method: get
        timeout: 3
        headers:
          User-Agent: "{user_agent}"
        allow_redirects: false
        ssl: false
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/api/v1/main/flows/nettacker/configs?s=dependent_on_temp_event[0]['status_code'][0]"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
              ports:
                - 8080
        response:
          save_to_temp_events_only: kestra_configs_1
          dependent_on_temp_event: kestra_auth_required_1
          condition_type: and
          conditions:
            status_code:
              regex: "^(?:200|404)$"
              reverse: false
            url:
              regex: 's=401$'
              reverse: false

      - method: get
        timeout: 3
        headers:
          User-Agent: "{user_agent}"
        allow_redirects: false
        ssl: false
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/api/v1/configs?s=dependent_on_temp_event[0]['status_code'][0]"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
              ports:
                - 8080
        response:
          dependent_on_temp_event: kestra_configs_1
          condition_type: and
          conditions:
            status_code:
              regex: "^200$"
              reverse: false
            content:
              regex: '(?:"edition":"[^"]*","commitId":"|"version":"0\.[^"]*","commitId":"[^"]+","commitDate":"[^"]+".*"isTaskRunEnabled":(?:true|false).*"systemNamespace":"[^"]+")'
              reverse: false
            url:
              regex: 's=(?:200|404)$'
              reverse: false

