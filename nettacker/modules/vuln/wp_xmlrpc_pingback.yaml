info:
  name: wp_xmlrpc_pingback_vuln
  author: OWASP Nettacker Team
  severity: 3
  description: Detects WordPress XML-RPC pingback.ping method exposure via system.listMethods.
  reference:
    - https://wordpress.org/documentation/article/xml-rpc-pingback-api/
    - https://www.owasp.org/index.php/WordPress_XML-RPC_Pingback_DoS
  profiles:
    - vuln
    - http
    - wordpress

payloads:
  - library: http
    steps:
      - method: post
        timeout: 3
        headers:
          User-Agent: "{user_agent}"
          Content-Type: "text/xml"
        allow_redirects: false
        ssl: false
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/xmlrpc.php"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
                - "https"
              ports:
                - 80
                - 443
        data: <methodCall><methodName>system.listMethods</methodName><params></params></methodCall>
        response:
          condition_type: and
          conditions:
            status_code:
              regex: "200"
              reverse: false
            content:
              regex: "pingback\.ping"
              reverse: false
