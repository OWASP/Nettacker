info:
  name: zimbra_cve_2025_68645_vuln
  author: devjoshi2005
  severity: 8.8
  description: >
    CVE-2025-68645 - Unauthenticated local file inclusion (LFI) vulnerability in the
    RestFilter servlet of the Webmail Classic UI in Synacor Zimbra Collaboration Suite
    (ZCS) 10.0.x prior to 10.0.18 and 10.1.x prior to 10.1.13, reachable through the
    /h/rest endpoint, allowing unauthenticated attackers to read arbitrary files from
    the WebRoot directory (and potentially leading to remote code execution when
    privileged configuration files are exposed). Added to the CISA Known Exploited
    Vulnerabilities catalog on 2026-01-22. This module checks for unauthenticated
    accessibility of the /h/rest endpoint, which indicates a Zimbra instance exposing
    the vulnerable RestFilter.

  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2025-68645
    - https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories
    - https://www.cve.org/CVERecord?id=CVE-2025-68645
    - https://github.com/MaxMnMl/zimbramail-CVE-2025-68645-poc

  profiles:
    - vuln
    - vulnerability
    - http
    - high_severity
    - cve
    - cve2025
    - cisa_kev
    - zimbra
    - LFI

payloads:
  - library: http
    steps:
      - method: get
        timeout: 5
        headers:
          User-Agent: "{user_agent}"
        allow_redirects: false
        ssl: false
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}{{paths}}"
            prefix: ""
            suffix: ""
            interceptors: []
            data:
              paths:
                - "/h/rest"
              schema:
                - "http"
                - "https"
              ports:
                - 80
                - 443
                - 7071
                - 7072
        response:
          condition_type: and
          conditions:
            status_code:
              regex: "200"
              reverse: false
            content:
              regex: "(?i)(zimbra|zcs|webmail.*classic|restfilter)"
              reverse: false
