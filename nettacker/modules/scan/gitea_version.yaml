info:
  name: gitea_version_scan
  author: P Samuel Vijay
  severity: 3
  description: Gitea version scan - detects Gitea via its public /api/v1/version endpoint and the page footer of its home and sign-in pages, and reports its version.
  reference:
    - https://about.gitea.com/
    - https://docs.gitea.com/administration/config-cheat-sheet
  profiles:
    - scan
    - http
    - gitea
    - info_severity
payloads:
  - library: http
    steps:
      - method: get
        timeout: 3
        headers:
          User-Agent: "{user_agent}"
        allow_redirects: false
        ssl: false
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/api/v1/version"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
                - "https"
              ports:
                - 80
                - 443
                - 3000
        response:
          condition_type: and
          conditions:
            status_code:
              regex: "200"
              reverse: false
            content:
              # Forgejo reports "X+gitea-Y" (v7+) or "X.Y.Z+N" (v1.20, v1.21); both are rejected.
              # Gitea nightlies ("1.22.6+15-gabc1234", "1.23.0+dev-...") are kept.
              regex: '^\s*\{{\s*"version"\s*:\s*"((?![^"]*\+gitea-)(?![^"]*\+\d+")[^"]+)"\s*\}}\s*$'
              reverse: false
          log: "response_dependent['content']"
      - method: get
        timeout: 3
        headers:
          User-Agent: "{user_agent}"
        allow_redirects: false
        ssl: false
        url:
          nettacker_fuzzer:
            input_format: "{{schema}}://{target}:{{ports}}/{{paths}}"
            prefix: ""
            suffix: ""
            interceptors:
            data:
              schema:
                - "http"
                - "https"
              ports:
                - 80
                - 443
                - 3000
              # "/" redirects when LANDING_PAGE is explore/login/organizations;
              # the sign-in page renders the footer even with REQUIRE_SIGNIN_VIEW.
              paths:
                - ""
                - "user/login"
        response:
          condition_type: and
          conditions:
            status_code:
              regex: "200"
              reverse: false
            content:
              # Footer software block: <div class="ui left"> (1.10-1.19, must name Gitea,
              # since Gogs uses the same markup) or <div class="left-links"> (1.20+, may
              # hide the "Powered by Gitea" link). The version is the first x.y.z after the
              # (localized) "Version:" label, optionally inside an admin link. Forgejo uses
              # the same markup, so pages mentioning forgejo are rejected.
              regex: '(?s)\A(?!.*forgejo).*?<footer\b[^>]*>\s*(?:(?:<div class="ui container">\s*)?<div class="ui left"[^>]*>(?=(?:(?!</div>).)*?\bGitea\b)|<div class="left-links"[^>]*>)(?:(?!</div>).)*?[:：]\s*(?:<span>\s*)?(?:<a\b[^>]*>\s*)?(\d+\.\d+\.\d+[^\s<&]*)'
              reverse: false
          log: "response_dependent['content']"
