info:
  name: blocked_chain_test
  author: OWASP Nettacker Team
  description: >
    Test fixture for the depends_on engine: two steps that should succeed,
    a middle step chosen to fail against a normal target (so it gets
    "blocked"), and a final step chained off the failing one - it should
    never run since a blocked dependency blocks everything after it.
  severity: info
  references: []
  tags: [test]
  profiles: [scan]

inputs:
  target:
    type: string
    required: true

defaults:
  on_failure: continue        # keep going so we can see the block, not abort the whole run
  timeout: 30
  retries: 1

execution:
  max_parallel: 1              # force strictly sequential execution for a clear before/after in the logs

steps:
  # ---------- expected to SUCCEED ----------
  - id: reachability_check
    module: http_status_scan
    depends_on: []
    params:
      target: "{target}"

  - id: waf_check
    module: waf_scan
    depends_on: [reachability_check]
    params:
      target: "{target}"

  # ---------- expected to FAIL/BLOCK ----------
  # A normal, non-expired target won't trip this, so it logs no event ->
  # the engine marks it "blocked" instead of "completed".
  - id: expired_cert_check
    module: ssl_expired_certificate_vuln
    depends_on: [waf_check]
    params:
      target: "{target}"

  # ---------- should NEVER RUN ----------
  # depends on the blocked step above, so evaluate_depends_on() resolves
  # this to "blocked" too, and it's skipped without ever starting.
  - id: final_step
    module: http_html_title_scan
    depends_on: [expired_cert_check]
    params:
      target: "{target}"
